apiVersion: v1
kind: Service
metadata:
  name: {{ include "sc.fullname" . }}-server
  labels: {{- include "sc.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector: {{- include "sc.selector" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - { name: http, port: 80, targetPort: http }
    - { name: metrics, port: 9090, targetPort: metrics }
