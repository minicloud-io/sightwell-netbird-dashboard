apiVersion: v1
kind: Service
metadata:
  name: {{ include "sc.fullname" . }}-dashboard
  labels: {{- include "sc.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  selector: {{- include "sc.selector" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
  ports:
    - { name: http, port: 80, targetPort: http }
