{{- $base := include "sc.baseURL" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sc.fullname" . }}-dashboard
  labels: {{- include "sc.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels: {{- include "sc.selector" . | nindent 6 }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels: {{- include "sc.selector" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
      {{- with .Values.dashboard.podAnnotations }}
      annotations: {{ toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.podSecurityContext }}
      securityContext: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dashboard
          image: {{ include "sc.image" .Values.dashboard.image | quote }}
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports:
            - { name: http, containerPort: {{ .Values.dashboard.containerPort }} }
          env:
            # The dashboard's runtime settings (docker/init_react_envs.sh), the
            # values NetBird's getting-started uses for the embedded IdP.
            - { name: NETBIRD_MGMT_API_ENDPOINT, value: {{ $base | quote }} }
            - { name: NETBIRD_MGMT_GRPC_API_ENDPOINT, value: {{ $base | quote }} }
            - { name: AUTH_AUTHORITY, value: {{ include "sc.issuer" . | quote }} }
            - { name: AUTH_CLIENT_ID, value: "netbird-dashboard" }
            - { name: AUTH_AUDIENCE, value: "netbird-dashboard" }
            - { name: AUTH_SUPPORTED_SCOPES, value: "openid profile email groups" }
            - { name: AUTH_REDIRECT_URI, value: "/nb-auth" }
            - { name: AUTH_SILENT_REDIRECT_URI, value: "/nb-silent-auth" }
            - { name: USE_AUTH0, value: "false" }
            {{- range $k, $v := .Values.dashboard.extraEnv }}
            - { name: {{ $k | quote }}, value: {{ $v | quote }} }
            {{- end }}
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          {{- with .Values.dashboard.securityContext }}
          securityContext: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.dashboard.resources }}
          resources: {{ toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.dashboard.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
